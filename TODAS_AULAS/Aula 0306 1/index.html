  <!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Usuário</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #a2a8ae, #145b54);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container{
        background: rgb(143, 203, 216);
        width: 400px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    h2{
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .campo{
        margin-bottom: 15px;
    }

    label{
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    input{
        width: 100%;
        padding: 10px;
        border: 1px solid #474646;
        border-radius: 8px;
        font-size: 16px;
    }

    input:focus{
        border-color: #6d8091;
        outline: none;
        box-shadow: 0 0 5px rgba(79,172,254,0.5);
    }

    button{
        width: 100%;
        padding: 12px;
        background: #416584;
        color: rgb(198, 200, 201);
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover{
        background: #07375fc7;
    }

    #resultado{
        margin-top: 20px;
        padding: 10px;
        background: #afadad;
        border-radius: 8px;
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Cadastro de Usuário</h2>

    <form id="formCadastro">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
        </div>

        <div class="campo">
    <label for="estado">Estado</label>
    <select id="estado" required>
        <option value="">Selecione</option>
        <option>AC</option>
        <option>AL</option>
        <option>AP</option>
        <option>AM</option>
        <option>BA</option>
        <option>CE</option>
        <option>DF</option>
        <option>ES</option>
        <option>GO</option>
        <option>MA</option>
        <option>MT</option>
        <option>MS</option>
        <option>MG</option>
        <option>PA</option>
        <option>PB</option>
        <option>PR</option>
        <option>PE</option>
        <option>PI</option>
        <option>RJ</option>
        <option>RN</option>
        <option>RS</option>
        <option>RO</option>
        <option>RR</option>
        <option>SC</option>
        <option>SP</option>
        <option>SE</option>
        <option>TO</option>
    </select>
</div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
        </div>

        <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" required>
        </div>

        <div class="campo">
    <label for="cidade">Cidade</label>
    <input type="text" id="cidade" required>
</div>

<div class="campo">
    <label for="cep">CEP</label>
    <input type="text" id="cep" placeholder="00000-000" required>
</div>

<div class="campo">
    <label for="endereco">Endereço Residencial</label>
    <input type="text" id="endereco" placeholder="Rua, Avenida, Número" required>
</div>

<div class="campo">
    <label for="bairro">Bairro</label>
    <input type="text" id="bairro" required>
</div>

<div class="campo">
    <label for="complemento">Complemento</label>
    <input type="text" id="complemento">
</div>

            <div class="campo">
            <label for="cargo">Cargo</label>
            <input type="cargo" id="cargo" required>
        </div>

        <div class="campo">
            <label for="Rg">RG</label>
            <input type="Rg" id="Rg" required>
        </div>

        <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" required>
        </div>

        <button type="submit">Enviar</button>

    </form>

    <div id="resultado"></div>
</div>

<script>

    const formulario = document.getElementById("formCadastro");

    formulario.addEventListener("submit", function(event){

        // Impede o envio padrão do formulário
        event.preventDefault();

        // Captura dos valores dos inputs
        let nome = document.getElementById("nome").value;
        let email = document.getElementById("email").value;
        let telefone = document.getElementById("telefone").value;
        let cpf = document.getElementById("cpf").value;

        // Exibe os dados na tela
        const resultado = document.getElementById("resultado");

        resultado.style.display = "block";

        resultado.innerHTML = `
            <h3>Dados Cadastrados</h3>
            <p><strong>Nome:</strong> ${nome}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>Telefone:</strong> ${telefone}</p>
            <p><strong>CPF:</strong> ${cpf}</p>
        `;

        alert("Cadastro realizado com sucesso!");
    });

</script>

</body>
</html>
