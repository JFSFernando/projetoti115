<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Tech Store</h1>
    <p>Os melhores produtos de tecnologia.</p>
</header>

<nav aria-label="Menu principal">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Produtos</a></li>
        <li><a href="#">Promoções</a></li>
        <li><a href="#">Contato</a></li>
    </ul>
</nav>

<main>

<section>
    <h2>Produtos</h2>

    <div class="produtos">

        <article class="produto">
            <img src="https://via.placeholder.com/250" alt="Notebook prata de 15 polegadas">
            <h3>Notebook</h3>
            <p>R$ 3.999,00</p>
            <button class="comprar">Comprar</button>
        </article>

        <article class="produto">
            <img src="https://via.placeholder.com/250" alt="Smartphone preto">
            <h3>Smartphone</h3>
            <p>R$ 2.199,00</p>
            <button class="comprar">Comprar</button>
        </article>

        <article class="produto">
            <img src="https://via.placeholder.com/250" alt="Fone de ouvido sem fio">
            <h3>Fone Bluetooth</h3>
            <p>R$ 299,00</p>
            <button class="comprar">Comprar</button>
        </article>

    </div>
</section>

<section>
    <h2>Newsletter</h2>

    <form id="newsletter">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <button type="submit">Cadastrar</button>
    </form>
</section>

</main>

<footer>
    <p>© 2026 Tech Store</p>
</footer>

<script src="script.js"></script>

</body>
</html>
